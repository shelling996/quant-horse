name: Daily Train - Quant Horse
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: write
jobs:
  train-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install catboost pandas numpy scikit-learn -q
      - name: Self-heal missing files
        run: |
          pwd
          ls -la
          echo "--- checking .github/workflows/daily.yml ---"
          ls -la .github/workflows/
          if [ ! -f main.py ]; then
            echo "main.py MISSING -> creating"
            cat > main.py << 'PY'
          import pandas as pd, datetime, os, random
          if not os.path.exists('races.csv'):
              rows=[]
              today=datetime.date.today()
              for r in range(60):
                  rid=f"HK_{today}_R{r+1}"
                  for h in range(12):
                      rows.append({'date':today,'race_id':rid,'horse_id':f"HK{random.randint(1000,9999)}",'horse_age':random.choice([3,4,5,6]),'horse_weight':random.randint(1100,1280),'jockey_win_rate':0.1,'trainer_win_rate':0.1,'last_5_avg_pos':5.0,'distance':1400,'market_odds':10.0,'won':1 if h==0 else 0})
              pd.DataFrame(rows).to_csv('races.csv',index=False)
          from model import load_and_train, predict
          model,df=load_and_train('races.csv')
          today=datetime.date.today()
          s=df.tail(12).copy()
          s['date']=today
          s['race_id']=[f"{today}_R{i//3+1}" for i in range(12)]
          s['P_model']=predict(model,s)
          s['P_market']=1/s['market_odds'].clip(1.5,50)
          s['Value']=s['P_model']/s['P_market']
          s['f_final']=0.02
          s['bankroll']=1.0
          s['cum_profit']=0.0
          s[['date','race_id','horse_id','P_model','P_market','Value','f_final','bankroll','cum_profit','market_odds']].to_csv('bets.csv',index=False)
          print("bets.csv READY")
          PY
          fi
          if [ ! -f model.py ]; then
            cat > model.py << 'PY'
          import pandas as pd
          from catboost import CatBoostClassifier
          FEATURES=['horse_age','horse_weight','jockey_win_rate','trainer_win_rate','last_5_avg_pos','distance']
          def load_and_train(p='races.csv'):
              df=pd.read_csv(p,parse_dates=['date'],errors='coerce').sort_values('date')
              X=df[FEATURES].fillna(df[FEATURES].median())
              y=df['won']
              m=CatBoostClassifier(iterations=200,depth=6,learning_rate=0.05,verbose=False)
              m.fit(X,y,verbose=False)
              return m,df
          def predict(m,df):
              return m.predict_proba(df[FEATURES].fillna(0))[:,1]
          PY
          fi
          ls -la
      - name: Run training
        run: python main.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add races.csv bets.csv main.py model.py || true
          git diff --cached --quiet || (git commit -m "train [skip ci]" && git push)
